<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" style="--dh-tinta:#1B1714;--dh-papel:#F2E9D8;--dh-piel:#DDA273;--dh-piel-sombra:#B87D4E;--dh-pelo:#4E342A;--dh-pelo-sombra:#33211A;--dh-ropa:#CF3A2B;--dh-ropa-2:#F2E9D8;--dh-fondo:#E7C86A;--dh-fondo-2:#D2A93F;--dh-acento:#CF3A2B;--dh-boca:#A8402F;--dh-cristal:#8FB8C4">
<defs>
  <pattern id="dh-trama" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="4" r="3" fill="var(--dh-fondo-2, #D2A93F)"/>
    <circle cx="12" cy="12" r="3" fill="var(--dh-fondo-2, #D2A93F)"/>
